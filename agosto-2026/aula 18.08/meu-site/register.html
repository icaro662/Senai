<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link rel="icon" href="./assets/senai-logo.png">
        <link rel="stylesheet" href="./style.css">
        <title>Registro | Senai</title>
    </head>

    <body>
        <nav>
            <table border="0" width="900" align="center">
                <tr>
                    <td>
                        <header>
                            <img src="./assets/senai-logo.png" height="89">
                        </header>
                    </td>
                    <td align="center">
                        <a href="./index.html"><strong>HOME</strong></a> |
                        <a href="./sobre.html"><strong>QUEM SOMOS</strong></a> |
                        <a href="./contatos.html"><strong>CONTATOS</strong></a> |
                        <a href="./login.html"><strong>LOGIN</strong></a> |
                        <a href="./register.html"><strong>INSCRIÇÃO</strong></a> 
                    </td>
                </tr>
            </table>
        </nav>

        <main>
            <table border="0" align="center" id="formulario-table">
                <tr>
                    <td>
                        <form action="#" method="post">
                            <fieldset id="field-info">
                                <legend>Informações pessoais</legend>

                                <p>
                                    <label for="nome">Nome completo:</label><br>
                                    <input type="text" id="nome" name="nome" autocomplete="name" required>
                                </p>

                                <p>
                                    <label for="email">E-mail:</label><br>
                                    <input type="email" id="email" name="email" autocomplete="email" required>
                                </p>

                                <p>
                                    <label for="cpf">CPF:</label><br>
                                    <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Informe o CPF no formato 000.000.000-00" required>
                                </p>

                                <p>
                                    <label for="telefone">Telefone:</label><br>
                                    <input type="tel" id="telefone" name="telefone" inputmode="tel" autocomplete="tel" pattern="\((1[1-9]|[2-9][0-9])\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" title="Informe o telefone no formato (DD) 00000-0000" required>
                                </p>

                                <p>
                                    <label for="senha">Senha:</label><br>
                                    <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Use pelo menos 8 caracteres, incluindo uma letra e um número" required>
                                </p>

                                <p>
                                    <label for="confirmar-senha">Confirmar senha:</label><br>
                                    <input type="password" id="confirmar-senha" name="confirmar_senha" autocomplete="new-password" required>
                                </p>

                                <p>
                                    <label for="genero">Sexo/gênero:</label><br>
                                    <select id="genero" name="genero" required>
                                        <option value="">Selecione uma opção</option>
                                        <option value="mulher-cis">Mulher cis</option>
                                        <option value="homem-cis">Homem cis</option>
                                        <option value="nao-binario">Não binário</option>
                                        <option value="prefiro-nao-informar">Prefiro não informar</option>
                                        <option value="outro">Outro</option>
                                    </select>
                                </p>

                                <p>
                                    <label for="situacao">Estado Civil</label><br>
                                    <select required>
                                        <option>Selecione seu estado civil</option>
                                        <option value="solteiro">Solteiro</option>
                                        <option value="casado">Casado</option>                
                                        <option value="viuvo">Viúvo</option>
                                        <option value="prefiro-nao-informar">Prefiro não informar</option>
                                    </select>
                                </p>
                            </fieldset>

                            <fieldset id="field-address">
                                <legend>Endereço</legend>

                                <p>
                                    <label for="cep">CEP:</label><br>
                                    <input type="text" id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Informe o CEP no formato 00000-000" required>
                                </p>

                                <p>
                                    <label for="logradouro">Logradouro:</label><br>
                                    <input type="text" id="logradouro" name="logradouro" autocomplete="street-address" required>
                                </p>

                                <p>
                                    <label for="numero">Número:</label><br>
                                    <input type="text" id="numero" name="numero" inputmode="numeric" required>
                                </p>

                                <p>
                                    <label for="complemento">Complemento:</label><br>
                                    <input type="text" id="complemento" name="complemento" autocomplete="address-line2">
                                </p>

                                <p>
                                    <label for="bairro">Bairro:</label><br>
                                    <input type="text" id="bairro" name="bairro" required>
                                </p>

                                <p>
                                    <label for="cidade">Cidade:</label><br>
                                    <input type="text" id="cidade" name="cidade" autocomplete="address-level2" required>
                                </p>

                                <p>
                                    <label for="estado">Estado:</label><br>
                                    <select id="estado" name="estado" autocomplete="address-level1" required>
                                        <option value="">Selecione o estado</option>
                                        <option value="AC">Acre</option>
                                        <option value="AL">Alagoas</option>
                                        <option value="AP">Amapá</option>
                                        <option value="AM">Amazonas</option>
                                        <option value="BA">Bahia</option>
                                        <option value="CE">Ceará</option>
                                        <option value="DF">Distrito Federal</option>
                                        <option value="ES">Espírito Santo</option>
                                        <option value="GO">Goiás</option>
                                        <option value="MA">Maranhão</option>
                                        <option value="MT">Mato Grosso</option>
                                        <option value="MS">Mato Grosso do Sul</option>
                                        <option value="MG">Minas Gerais</option>
                                        <option value="PA">Pará</option>
                                        <option value="PB">Paraíba</option>
                                        <option value="PR">Paraná</option>
                                        <option value="PE">Pernambuco</option>
                                        <option value="PI">Piauí</option>
                                        <option value="RJ">Rio de Janeiro</option>
                                        <option value="RN">Rio Grande do Norte</option>
                                        <option value="RS">Rio Grande do Sul</option>
                                        <option value="RO">Rondônia</option>
                                        <option value="RR">Roraima</option>
                                        <option value="SC">Santa Catarina</option>
                                        <option value="SP">São Paulo</option>
                                        <option value="SE">Sergipe</option>
                                        <option value="TO">Tocantins</option>
                                    </select>
                                </p>
                            </fieldset>

                            <fieldset id="field-course">
                                <legend>Curso</legend>

                                <p>
                                    <label for="curso">Tipo de curso:</label><br>
                                    <select id="curso" name="curso" required>
                                        <option value="">Selecione o curso</option>
                                        <option value="desenvolvimento-sistemas">Desenvolvimento de Sistemas</option>
                                        <option value="redes-computadores">Redes de Computadores</option>
                                        <option value="informatica">Informática</option>
                                        <option value="seguranca-informacao">Segurança da Informação</option>
                                        <option value="banco-dados">Banco de Dados</option>
                                        <option value="analise-desenvolvimento-sistemas">Análise e Desenvolvimento de Sistemas</option>
                                        <option value="ciencia-dados">Ciência de Dados</option>
                                        <option value="computacao-nuvem">Computação em Nuvem</option>
                                    </select>
                                </p>

                                <p>
                                    <span>Turno:</span><br>
                                    <input type="radio" id="manha" name="turno" value="manha" required>
                                    <label for="manha">Manhã</label>
                                    <input type="radio" id="tarde" name="turno" value="tarde">
                                    <label for="tarde">Tarde</label>
                                    <input type="radio" id="noite" name="turno" value="noite">
                                    <label for="noite">Noite</label>
                                </p>

                                <p>
                                    <label for="semestre">Semestre:</label><br>
                                    <select id="semestre" name="semestre" required>
                                        <option value="">Selecione o semestre</option>
                                        <option value="1">1º semestre</option>
                                        <option value="2">2º semestre</option>
                                        <option value="3">3º semestre</option>
                                        <option value="4">4º semestre</option>
                                        <option value="5">5º semestre</option>
                                        <option value="6">6º semestre</option>
                                        <option value="7">7º semestre</option>
                                        <option value="8">8º semestre</option>
                                    </select>
                                </p>

                                <p>
                                    <label for="observacoes">Observações:</label><br>
                                    <textarea id="observacoes" name="observacoes" rows="5" cols="40"></textarea>
                                </p>

                                <p>
                                    <input type="submit" value="FINALIZAR INSCRIÇÃO" id="register-button">
                                </p>
                            </fieldset>
                        </form>
                    </td>
                </tr>
            </table>
        </main>

        <footer>
            <table border="0" width="900" align="center">
                <tr>
                    <td colspan="2" align="center">
                        <h2>FAÇA PARTE DO NOSSO TIME!</h2>
                        <form>
                            <input type="submit" value="CLIQUE AQUI E SE INSCREVA-SE AGORA">
                        </form>
                        <h4>&copy Todos os Direitos Reservados</h4>
                    </td>
                </tr>
            </table>
        </footer>
    </body>
</html>
