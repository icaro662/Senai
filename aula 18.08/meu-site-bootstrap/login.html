<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="icon" href="./assets/senai-logo.png">
        <link rel="stylesheet" href="./style/login.css">
        <title>Login | Senai</title>
    </head>

    <body class="login-body">
        <nav id="main-nav" class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-3 rounded-1">
            <div class="container-fluid">
                <img src="./assets/senai-logo.png" height="60">
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <div class="navbar-div">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="navbar-bar">
                            <li class="nav-item">
                                <a class="nav-link active anchor-tag" aria-current="page" href="./index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active anchor-tag" href="./sobre.html">Sobre</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active anchor-tag" href="./contatos.html">Contatos</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <main class="login-main">
            <div class="login-background-img-div">
                <img id="background-jpeg" src="./assets/login-background.jpg" alt="Imagem de fundo da tela de login">
            </div>
            <div class="login-form-div">
                <form id="login-form">
                    <img class="login-logo" src="./assets/senai-logo.png" alt="SENAI">
                    <h1 style="font-size: 20px; text-align: center;">Entrar com sua conta SENAI</h1>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" required>
                    </div>
                    <div id="login-bottom-section-div">
                        <button type="submit" formaction="./index.html" class="btn btn-primary w-100">Entrar</button>
                        <div class="login-form-links">
                            <a href="#">Esqueci a senha</a>
                            <a href="./register.html">Registrar</a>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
