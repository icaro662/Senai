<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="icon" href="./assets/senai-logo.png">
        <link rel="stylesheet" href="./style.css">
        <title>Login | Senai</title>
    </head>

    <body class="login-body">
        <main class="login-main">
            <div class="login-background-img-div">
                <img id="background-jpeg" src="./assets/login-background.jpg" alt="Imagem de fundo da tela de login">
            </div>
            <div class="login-form-div">
                <form id="login-form">
                    <img class="login-logo" src="./assets/senai-logo.png" alt="SENAI">
                    <h1>Entrar</h1>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
                        <div id="emailHelp" class="form-text">Nunca compartilharemos suas informações pessoais.</div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" required>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        <a href="#" style="text-decoration: none;">Esqueci a senha</a>
                    </div>
                </form>
                <nav id="nav-card-login" class="card" aria-label="Navegação principal">
                    <a href="./index.html">Home</a>
                    <a href="./sobre.html">Sobre</a>
                    <a href="./contatos.html">Contatos</a>
                    <a href="./register.html">Registrar</a>
                </nav>
            </div>
        </main>
    </body>
</html>
