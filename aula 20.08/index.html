<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro</title>
    </head>

    <body>
        <main>
            <center><h1>Formulário de Cadastro</h1></center>
            <form action="#NomeDoArquivoBackend" method="post" enctype="multipart/form-data"></form>

            <!--- DADOS PESSOAIS-->
    
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" maxlength="100" required>

                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>

                <br><br>

                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha" placeholder="Insira sua senha" minlength="8" maxlength="20" required>

                <br><br>

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" pattern="[0-9][0-9][0-9]{3}\.?[0-9][0-9][0-9]{3}\.?[0-9][0-9][0-9]{3}-?[0-9][0-9]{2}" 
                placeholder="000.000.000-00" title="Digite seu CPF no formato 000.000.000-00" required>

                <br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone" pattern="\([1-9][0-9]{2}\) 9[0-9]{4}\-[0-9]{4}" 
                placeholder="00 00000-0000" title="Digite seu número e DDD" required>
            </fieldset>
            <br>

            <!--INFORMAÇÕES ACADÉMICAS-->

            <fieldset>
                <legend>Informações académicas</legend>

                <label for="curso">Curso:</label>
                <select id="curso" name="curso" >
                    <option value="">Selecione um curso</option>
                    <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                    <option value="redes">Redes de computadores</option>
                    <option value="informatica">Informática</option>
                    <option value="web">Desenvolvimento Web</option>
                </select> 
                <br>

                <p>Turno:</p>
                
                <input type="radio" id="manha" name="turno" value="manha">
                <label for="manha">Manhã</label>
                <br>

                <input type="radio" id="tarde" name="turno" value="tarde">
                <label for="tarde">Tarde</label>
                <br>

                <input type="radio" id="noite" name="turno" value="noite">
                <label for="noite">Noite</label>

                <br><br>

                <label for="semestre">Semestre:</label>
                <input type="number" id="semestre" name="semestre" min="1" max="10" step="1" value="1">
            </fieldset>
            <br>

             <!--PREFERÊNCIAS-->
            
            <fieldset>
                <legend>Preferências Tecnológicas</legend>

                <p>Quais são as tecnologias que você conhece?</p>

                <input type="checkbox" id="html" name="html" value="html">
                <label for="html">HTML</label>
                <br>
                <input type="checkbox" id="css" name="css" value="css">
                <label for="css">CSS</label>
                <br>
                <input type="checkbox" id="js" name="js" value="js">
                <label for="js">JavaScript</label>
                <br>
                <input type="checkbox" id="python" name="python" value="python">
                <label for="python">Python</label>
                <br>
                <input type="checkbox" id="java" name="java" value="java">
                <label for="java">Java</label>
            </fieldset>
        </main>
    </body>
</html>
